<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#142f32">
    <meta name="description" content="Explore the world in pixel art. Orbit real city geometry, plan a route, and drive, sail or fly through the atlas.">
    <title>Pixel Atlas · UnoPixelMap</title>
    <link rel="icon" href="favicon.ico">
    <script src="audio/journey-audio.js"></script>
    <script src="input/map-input.js"></script>
    <script>
        // A visible diagnostic survives failures before the Uno visual tree exists.
        // This is capability detection, not a claim that a frame has rendered.
        globalThis.PixelAtlasGraphics = {
            state: "checking",
            failure: null,
            fail(message) {
                const graphics = globalThis.PixelAtlasGraphics;
                graphics.state = "unavailable";
                graphics.failure = String(message);
                const show = () => {
                    document.documentElement.dataset.pixelmapGraphics = graphics.state;
                    const panel = document.getElementById("pixelmap-graphics-error");
                    document.getElementById("pixelmap-graphics-detail").textContent = graphics.failure;
                    panel.hidden = false;
                    document.getElementById("pixelmap-graphics-title").focus();
                };
                if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show, {once: true});
                else show();
            }
        };
        // MapSurface supplies the actual borrowed GPUDevice through Uno's public
        // WebGpuJsInterop. Observation changes neither device creation nor ownership.
        // Each subscription notifies managed rendering too, so a loss stops submissions
        // and invalidates picking instead of only covering an otherwise live renderer.
        {
            const watchedDevices = new WeakMap();
            const activeObservations = new Set();
            let closing = false;
            function detach(subscription) {
                if (!subscription?.active) return;
                subscription.active = false;
                subscription.failed = null;
                const record = subscription.record;
                subscription.record = null;
                activeObservations.delete(subscription);
                record.subscriptions.delete(subscription);
                if (!record.subscriptions.size)
                    record.device.removeEventListener("uncapturederror", record.error);
            }
            function report(subscription, message) {
                if (!subscription.active || closing) return;
                const failed = subscription.failed;
                // Clear the marshalled delegate before invoking it: managed Fail
                // disposes the same subscription, and queued notifications must stop.
                detach(subscription);
                try { failed(message); }
                catch (error) { console.error("Pixel Atlas could not notify its renderer of WebGPU failure.", error); }
                finally {
                    // Keep HTML diagnostics available even during managed teardown.
                    if (!PixelAtlasGraphics.failure) PixelAtlasGraphics.fail(message);
                }
            }
            PixelAtlasGraphics.observeDevice = (device, failed) => {
                if (!device || typeof device.lost?.then !== "function" ||
                    typeof device.addEventListener !== "function" || typeof failed !== "function")
                    throw new Error("Uno did not expose a live shared browser GPUDevice.");
                if (closing) return { active: false, record: null, failed: null };
                let record = watchedDevices.get(device);
                if (!record) {
                    record = { device, subscriptions: new Set(), loss: null, error: null };
                    record.error = event => {
                        const message = "WebGPU could not render this scene. " + (event.error?.message || "An uncaptured GPU error occurred.");
                        for (const subscription of [...record.subscriptions]) report(subscription, message);
                    };
                    watchedDevices.set(device, record);
                    // A promise cannot be unsubscribed. Install it only once per
                    // device; detached subscriptions retain no managed callbacks.
                    device.lost.then(info => {
                        record.loss = "The graphics device was lost. Reload Pixel Atlas to rebuild its resources. " + info.message;
                        for (const subscription of [...record.subscriptions]) report(subscription, record.loss);
                    });
                }
                const subscription = { active: true, record, failed };
                record.subscriptions.add(subscription);
                activeObservations.add(subscription);
                try {
                    if (record.subscriptions.size === 1) device.addEventListener("uncapturederror", record.error);
                    if (record.loss !== null) queueMicrotask(() => report(subscription, record.loss));
                    return subscription;
                } catch (error) {
                    detach(subscription);
                    throw error;
                }
            };
            PixelAtlasGraphics.stopObserving = detach;
            addEventListener("pagehide", event => {
                if (event.persisted) return;
                closing = true;
                for (const subscription of [...activeObservations]) detach(subscription);
            });
        }
        document.addEventListener("DOMContentLoaded", async () => {
            const graphics = globalThis.PixelAtlasGraphics;
            document.getElementById("pixelmap-graphics-retry").addEventListener("click", () => location.reload());
            if (!globalThis.isSecureContext) {
                graphics.fail("WebGPU requires a secure connection. Open Pixel Atlas over HTTPS or localhost.");
                return;
            }
            if (!navigator.gpu) {
                graphics.fail("This browser does not provide WebGPU. Update your browser and enable hardware acceleration, then try again.");
                return;
            }
            try {
                const adapter = await navigator.gpu.requestAdapter({powerPreference: "high-performance"});
                if (!adapter) {
                    graphics.fail("No WebGPU graphics adapter is available. Check that hardware acceleration is enabled and your graphics driver is current.");
                    return;
                }
                if (!graphics.failure) {
                    graphics.state = "available";
                    document.documentElement.dataset.pixelmapGraphics = graphics.state;
                }
            } catch (error) {
                graphics.fail("The browser could not initialize WebGPU. " + (error?.message || String(error)));
            }
        }, {once: true});
    </script>
    <script src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)
    <style>
        /* The canvas paints over the splash as soon as its first frame is ready. */
        #uno-body { isolation: isolate; }
        #uno-body > .uno-loader { z-index: -1; pointer-events: none; }
        #uno-canvas { touch-action: none; overscroll-behavior: none; }
        #pixelmap-graphics-error {
            position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box;
            display: grid; align-content: center; justify-items: start; gap: 1rem;
            padding: clamp(1.5rem, 6vw, 5rem); background: #142f32; color: #f5f1e8;
            font: 1rem/1.6 system-ui, sans-serif;
        }
        #pixelmap-graphics-error[hidden] { display: none; }
        #pixelmap-graphics-error h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.5rem); }
        #pixelmap-graphics-error p { max-width: 44rem; margin: 0; }
        #pixelmap-graphics-retry {
            border: 0; border-radius: .5rem; padding: .65rem 1.25rem;
            background: #f6c069; color: #142f32; font: inherit; font-weight: 600; cursor: pointer;
        }
        #pixelmap-graphics-retry:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
</head>
<body>
    <section id="pixelmap-graphics-error" role="alert" aria-labelledby="pixelmap-graphics-title" hidden>
        <h1 id="pixelmap-graphics-title" tabindex="-1">WebGPU is unavailable</h1>
        <p id="pixelmap-graphics-detail"></p>
        <button id="pixelmap-graphics-retry" type="button">Try again</button>
    </section>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader" loading-position="bottom" loading-alert="none" role="status" aria-label="Opening Pixel Atlas">
            <img class="logo" src="" alt="Pixel Atlas">
            <progress aria-label="Loading the atlas"></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>Enable JavaScript and WebAssembly to explore Pixel Atlas.</noscript>
</body>
</html>
