<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="Explore the world in pixel art. Orbit real city geometry, plan a route, and drive, sail or fly through the atlas.">
    <title>Pixel Atlas · UnoPixelMap</title>
    <link rel="icon" href="favicon.ico">
    <script src="audio/journey-audio.js"></script>
    <script src="input/map-input.js"></script>
    <script>
        // A visible diagnostic survives failures before the Uno visual tree exists.
        // This is capability detection, not a claim that a frame has rendered.
        globalThis.PixelAtlasGraphics = {
            state: "checking",
            failure: null,
            fail(message) {
                const graphics = globalThis.PixelAtlasGraphics;
                graphics.state = "unavailable";
                graphics.failure = String(message);
                const show = () => {
                    document.documentElement.dataset.pixelmapGraphics = graphics.state;
                    const panel = document.getElementById("pixelmap-graphics-error");
                    document.getElementById("pixelmap-graphics-detail").textContent = graphics.failure;
                    panel.hidden = false;
                    document.getElementById("pixelmap-graphics-title").focus();
                };
                if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show, {once: true});
                else show();
            }
        };
        document.addEventListener("DOMContentLoaded", async () => {
            const graphics = globalThis.PixelAtlasGraphics;
            document.getElementById("pixelmap-graphics-retry").addEventListener("click", () => location.reload());
            if (!globalThis.isSecureContext) {
                graphics.fail("WebGPU requires a secure connection. Open Pixel Atlas over HTTPS or localhost.");
                return;
            }
            if (!navigator.gpu) {
                graphics.fail("This browser does not provide WebGPU. Update your browser and enable hardware acceleration, then try again.");
                return;
            }
            try {
                const adapter = await navigator.gpu.requestAdapter({powerPreference: "high-performance"});
                if (!adapter) {
                    graphics.fail("No WebGPU graphics adapter is available. Check that hardware acceleration is enabled and your graphics driver is current.");
                    return;
                }
                if (!graphics.failure) {
                    graphics.state = "available";
                    document.documentElement.dataset.pixelmapGraphics = graphics.state;
                }
            } catch (error) {
                graphics.fail("The browser could not initialize WebGPU. " + (error?.message || String(error)));
            }
        }, {once: true});
    </script>
    <script>
        // Native XAML uses these event-driven metrics; no backdrop filters or
        // permanent polling are needed for safe areas and the software keyboard.
        globalThis.PixelAtlasViewport = (() => {
            const subscribers = new Map();
            let probe, frame = 0, listening = false;
            function read() {
                if (!probe && document.body) {
                    probe = document.createElement("div");
                    probe.setAttribute("aria-hidden", "true");
                    probe.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;width:0;height:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
                    document.body.append(probe);
                }
                const style = probe ? getComputedStyle(probe) : null;
                const number = name => Math.max(0, parseFloat(style?.[name]) || 0);
                const visual = window.visualViewport;
                return [window.innerHeight, visual?.height || window.innerHeight, visual?.offsetTop || 0,
                    number("paddingTop"), number("paddingRight"), number("paddingBottom"), number("paddingLeft")];
            }
            function changed() {
                if (frame || !subscribers.size) return;
                frame = requestAnimationFrame(() => {
                    frame = 0;
                    for (const notify of subscribers.values()) notify();
                });
            }
            return {
                read,
                attach(id, notify) {
                    subscribers.set(id, notify);
                    if (!listening) {
                        listening = true;
                        window.addEventListener("resize", changed, {passive: true});
                        window.visualViewport?.addEventListener("resize", changed, {passive: true});
                        window.visualViewport?.addEventListener("scroll", changed, {passive: true});
                    }
                    changed();
                },
                detach(id) {
                    subscribers.delete(id);
                    if (subscribers.size || !listening) return;
                    listening = false;
                    window.removeEventListener("resize", changed);
                    window.visualViewport?.removeEventListener("resize", changed);
                    window.visualViewport?.removeEventListener("scroll", changed);
                    if (frame) cancelAnimationFrame(frame);
                    frame = 0;
                    probe?.remove(); probe = null;
                },
                locate(id, found, failed) {
                    const owner = subscribers.get(id);
                    if (!owner) return;
                    // A location result can arrive after native XAML has unloaded
                    // and reloaded. Only the requesting attachment may consume it.
                    const active = () => subscribers.get(id) === owner;
                    if (!navigator.geolocation) { failed("This browser does not provide location access."); return; }
                    navigator.geolocation.getCurrentPosition(position => {
                        if (active()) found(position.coords.latitude, position.coords.longitude);
                    }, error => {
                        if (!active()) return;
                        failed(error.code === 1 ? "Location access is off. Allow location for this site in your browser, then try again."
                            : error.code === 3 ? "Your location could not be found in time. Try again outdoors or search for a place."
                            : "Your location is unavailable. Try again or search for a place.");
                    }, {enableHighAccuracy: false, timeout: 12000, maximumAge: 60000});
                }
            };
        })();
    </script>
    <script src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #dce5e3; }
        button, input, select, textarea { font: inherit; }
        /* The canvas paints over the splash as soon as its first frame is ready. */
        #uno-body { isolation: isolate; width: 100%; height: 100%; }
        #uno-body > .uno-loader { z-index: -1; pointer-events: none; }
        #uno-canvas { touch-action: none; overscroll-behavior: none; }
        #pixelmap-graphics-error {
            position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box;
            display: grid; align-content: center; justify-items: start; gap: 1rem;
            padding: clamp(1.5rem, 6vw, 5rem); background: #f5f5f7; color: #1c1c1e;
            font: 1rem/1.6 system-ui, sans-serif;
        }
        #pixelmap-graphics-error[hidden] { display: none; }
        #pixelmap-graphics-error h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.5rem); }
        #pixelmap-graphics-error p { max-width: 44rem; margin: 0; }
        #pixelmap-graphics-retry {
            border: 0; border-radius: .75rem; min-height: 44px; padding: .65rem 1.25rem;
            background: #007aff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
        }
        #pixelmap-graphics-retry:focus-visible { outline: 3px solid #007aff; outline-offset: 4px; }
    </style>
</head>
<body>
    <section id="pixelmap-graphics-error" role="alert" aria-labelledby="pixelmap-graphics-title" hidden>
        <h1 id="pixelmap-graphics-title" tabindex="-1">WebGPU is unavailable</h1>
        <p id="pixelmap-graphics-detail"></p>
        <button id="pixelmap-graphics-retry" type="button">Try again</button>
    </section>
    <div id="uno-body" class="container-fluid uno-body">
        <div class="uno-loader" loading-position="bottom" loading-alert="none" role="status" aria-label="Opening Pixel Atlas">
            <img class="logo" src="" alt="Pixel Atlas">
            <progress aria-label="Loading the atlas"></progress>
            <span class="alert"></span>
        </div>
    </div>
    <noscript>Enable JavaScript and WebAssembly to explore Pixel Atlas.</noscript>
</body>
</html>
