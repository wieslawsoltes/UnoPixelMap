name: Pixel Atlas · browser and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixelmap-pages
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/PixelMap.Data.Checks -c Release
      - run: dotnet run --project tests/PixelMap.Rendering.Tests -c Release
      - name: Verify GLES terrain and model shaders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          dotnet run --project tests/PixelMap.Rendering.Tests -c Release -- --gpu-terrain --gpu-output="${{ runner.temp }}/gpu-terrain"
      - run: dotnet run --project tests/PixelMap.Routing.Tests -c Release
      - run: dotnet run --project tests/PixelMap.Simulation.Tests -c Release
      - run: node tests/browser/audio.cjs
      - run: node tests/browser/input-adapter.cjs
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: dotnet publish src/PixelMap.App -c Release -f net10.0-browserwasm -o "${{ runner.temp }}/atlas"
      - name: Verify the Pages artifact
        run: test -s "${{ runner.temp }}/atlas/wwwroot/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/atlas/wwwroot
  verify:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the exact Pages deployment
        run: |
          mkdir -p "${{ runner.temp }}/atlas/wwwroot"
          tar -xf "${{ runner.temp }}/pages/artifact.tar" -C "${{ runner.temp }}/atlas/wwwroot"
      - name: Exercise the published map in Chromium
        run: |
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          mkdir -p "${{ runner.temp }}/preview"
          ln -s "${{ runner.temp }}/atlas/wwwroot" "${{ runner.temp }}/preview/UnoPixelMap"
          python3 -m http.server 8100 --bind 127.0.0.1 --directory "${{ runner.temp }}/preview" > /tmp/atlas-server.log 2>&1 &
          PIXELMAP_SHOTS="${{ runner.temp }}/screens" node tests/browser/smoke.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_SHOTS="${{ runner.temp }}/screens" node tests/browser/journeys.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_GPU=1 PIXELMAP_SHOTS="${{ runner.temp }}/screens/gpu" node tests/browser/smoke.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_GPU=1 PIXELMAP_SHOTS="${{ runner.temp }}/screens/gpu" node tests/browser/journeys.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_SHOTS="${{ runner.temp }}/screens/terrain" node tests/browser/terrain.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_GPU=1 PIXELMAP_SHOTS="${{ runner.temp }}/screens/terrain-gpu" node tests/browser/terrain.cjs http://127.0.0.1:8100/UnoPixelMap/
          PIXELMAP_SHOTS="${{ runner.temp }}/screens/explore" node tests/browser/explore.cjs http://127.0.0.1:8100/UnoPixelMap/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: publish
        uses: actions/deploy-pages@v4
