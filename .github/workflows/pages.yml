name: Pixel Atlas · frozen corpus memory replay
on:
  push:
    branches: [diagnostic/live-memory]
  workflow_dispatch:
    inputs:
      play_benchmark:
        description: Compatibility input; unused by this diagnostic
        type: boolean
        default: false
      baseline_run_id:
        description: Compatibility input; the diagnostic artifact is fixed
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pixelmap-live-memory-diagnostic
  cancel-in-progress: false
jobs:
  diagnose-frozen-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIXELMAP_LIVE_SECONDS: '540'
      PIXELMAP_CORPUS_MIB: '256'
      PIXELMAP_APPLICATION_SOURCE: '9171e95efab06db930a97dde212d754b8da48f60'
      PIXELMAP_REPLAY_MANIFEST_SHA256: 'd66136be7fd4a19d85756ad4fce10521a1a67096053702dda2c3600bc1a7c606'
      PIXELMAP_LIVE_REPEAT_CYCLES: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize diagnostic directories
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/diagnostic-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PIXELMAP_LIVE_OUTPUT=%s/corpus-memory\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PIXELMAP_REPLAY_MANIFEST=%s/frozen-corpus/corpus-manifest.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Verify the frozen application and captured corpus identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$PIXELMAP_LIVE_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42370846132" > "$PIXELMAP_LIVE_OUTPUT/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13574430917" > "$PIXELMAP_LIVE_OUTPUT/source-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42376068987" > "$PIXELMAP_LIVE_OUTPUT/capture-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13575726810" > "$PIXELMAP_LIVE_OUTPUT/capture-artifact.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PIXELMAP_LIVE_OUTPUT'])
          run = json.loads((root / 'source-run.json').read_text())
          artifact = json.loads((root / 'source-artifact.json').read_text())
          source = '9171e95efab06db930a97dde212d754b8da48f60'
          digest = 'sha256:2d75cd54800e363c496c1548c22b53c4611c14d9a3633dbeb80c13878cbaae73'
          assert run['id'] == 42370846132 and run['head_sha'] == source
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['repository']['id'] == 1443492055
          assert run['head_branch'] == 'main' and run['conclusion'] == 'success'
          assert artifact['id'] == 13574430917 and artifact['name'] == 'github-pages' and not artifact['expired']
          assert artifact['workflow_run']['id'] == run['id']
          assert artifact['workflow_run']['head_sha'] == source
          assert artifact['digest'] == digest and artifact['size_in_bytes'] == 88296669
          assert source == os.environ['PIXELMAP_APPLICATION_SOURCE']
          capture_run = json.loads((root / 'capture-run.json').read_text())
          capture_artifact = json.loads((root / 'capture-artifact.json').read_text())
          capture_source = '83980ac3b2da59970321bf183dfe8b48f876d9ec'
          assert capture_run['id'] == 42376068987 and capture_run['head_sha'] == capture_source
          assert capture_run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert capture_run['repository']['id'] == 1443492055
          assert capture_run['head_branch'] == 'diagnostic/live-memory' and capture_run['conclusion'] == 'success'
          assert capture_artifact['id'] == 13575726810 and capture_artifact['name'] == 'atlas-live-memory-9171e95'
          assert not capture_artifact['expired'] and capture_artifact['size_in_bytes'] == 17338602
          assert capture_artifact['workflow_run']['id'] == capture_run['id']
          assert capture_artifact['workflow_run']['head_sha'] == capture_source
          assert capture_artifact['digest'] == 'sha256:017c91bd60ae21db6da9e9b1b96ce55ad0b00fa021b44b6788c9f937321f8581'
          print('Verified frozen 9171e95 application and 83980ac capture runs, exact artifact IDs, sizes and ZIP digest metadata.')
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13574430917'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '42370846132'
          merge-multiple: true
          path: ${{ runner.temp }}/frozen-pages
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13575726810'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '42376068987'
          merge-multiple: true
          path: ${{ runner.temp }}/frozen-corpus
      - name: Verify exact artifact contents and AOT boot resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = Path(os.environ['PIXELMAP_LIVE_OUTPUT'])
          manifest_path = Path(os.environ['PIXELMAP_REPLAY_MANIFEST'])
          manifest_bytes = manifest_path.read_bytes()
          manifest_hash = hashlib.sha256(manifest_bytes).hexdigest()
          assert manifest_hash == os.environ['PIXELMAP_REPLAY_MANIFEST_SHA256']
          manifest = json.loads(manifest_bytes)
          assert manifest['source'] == os.environ['PIXELMAP_APPLICATION_SOURCE']
          assert manifest['bodyFormat'] == 'decoded HTTP response bytes' and manifest['corpusTruncated'] is False
          assert len(manifest['requests']) == 170 and manifest['storedBytes'] == 19322575
          assert len({entry['sha256'] for entry in manifest['requests']}) == 165
          (evidence / 'replay-input-manifest.json').write_bytes(manifest_bytes)
          archive = root / 'frozen-pages/artifact.tar'
          tar_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert tar_hash == '6c5576660410404d31e9b7f96b0df47db633cc0bdd7c32f4c780269130ca9b09'
          site = root / 'preview/UnoPixelMap'
          site.mkdir(parents=True)
          with tarfile.open(archive) as package:
              package.extractall(site, filter='data')
          configs = list(site.glob('package_*/uno-config.js'))
          assert len(configs) == 1
          config_path = configs[0]
          assert config_path.parent.name == 'package_a0ae44c1d7a17c40e475a043b19e258b0e2701134e71946f2c140b5b4093f6d9'
          config = config_path.read_text()
          mode = re.search(r'\["UNO_BOOTSTRAP_MONO_RUNTIME_MODE"\]\s*=\s*"([^"]+)"', config)
          assert mode and mode.group(1) == 'InterpreterAndAOT'
          loader_name = re.search(r'config\.dotnet_js_filename\s*=\s*"([\w.-]+)"', config).group(1)
          loader = site / '_framework' / loader_name
          assert hashlib.sha256(loader.read_bytes()).hexdigest() == '5180ff773f69c6b957827d123d9e984355af1054fe31f558dd2cc3de8f6462df'
          boot = json.loads(loader.read_text().split('/*json-start*/', 1)[1].split('/*json-end*/', 1)[0])
          resources = []
          for group, entries in boot['resources'].items():
              if not isinstance(entries, list):
                  continue
              for entry in entries:
                  path = (site / '_framework' / entry['name']).resolve()
                  assert path.is_relative_to(site.resolve())
                  digest = hashlib.sha256(path.read_bytes()).digest()
                  if 'hash' in entry:
                      assert entry['hash'] == 'sha256-' + base64.b64encode(digest).decode(), entry['name']
                  resources.append({'group': group, 'name': entry['name'], 'sha256': digest.hex(), 'bytes': path.stat().st_size})
          native = next(value for value in resources if value['group'] == 'wasmNative')
          assert native['sha256'] == '153cd183a5572ea9be22944ab059a586d75c7b45a1fa272f21abbe5df96d43c7'
          assert len(resources) == 72
          provenance = {'application_source': '9171e95efab06db930a97dde212d754b8da48f60',
              'application_run': 42370846132, 'artifact_id': 13574430917,
              'artifact_zip_sha256': '2d75cd54800e363c496c1548c22b53c4611c14d9a3633dbeb80c13878cbaae73',
              'archive_verification': 'API ZIP digest checked; download-artifact retrieves/extracts ZIP; exact artifact.tar SHA256 checked independently against the audited ZIP member.',
              'artifact_tar_sha256': tar_hash, 'runtime_mode': mode.group(1), 'package': config_path.parent.name,
              'diagnostic_source': os.environ['GITHUB_SHA'], 'diagnostic_run': os.environ['GITHUB_RUN_ID'],
              'diagnostic_script_sha256': hashlib.sha256(Path('tests/browser/live-memory.cjs').read_bytes()).hexdigest(),
              'corpus': {'capture_source': '83980ac3b2da59970321bf183dfe8b48f876d9ec',
                  'capture_run': 42376068987, 'artifact_id': 13575726810,
                  'artifact_zip_sha256': '017c91bd60ae21db6da9e9b1b96ce55ad0b00fa021b44b6788c9f937321f8581',
                  'manifest_sha256': manifest_hash, 'captured_application_source': manifest['source'],
                  'archive_verification': 'API ZIP digest checked; download-artifact retrieves/extracts ZIP; manifest SHA256 checked independently. The replay script validates every referenced body length and SHA256 before launching the browser.',
                  'provider_mode': 'frozen-corpus-immediate', 'repeat_cycles': 3,
                  'requests': 170, 'unique_bodies': 165, 'unique_body_bytes': 19322575},
              'resources': resources}
          (evidence / 'verified-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print('Exact archived AOT bytes and all 72 boot resources verified. No application build occurs.')
          PY
      - name: Install the pinned browser
        run: |
          set -euo pipefail
          node tests/browser/live-memory.cjs --self-check | tee "$PIXELMAP_LIVE_OUTPUT/script-self-check.log"
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium --only-shell)
          node --version > "$PIXELMAP_LIVE_OUTPUT/node-version.txt"
          (cd tests/browser && npx playwright --version) > "$PIXELMAP_LIVE_OUTPUT/playwright-version.txt"
      - name: Replay the exact captured corpus and three native input cycles
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -m http.server 8100 --bind 127.0.0.1 --directory "$RUNNER_TEMP/preview" > "$PIXELMAP_LIVE_OUTPUT/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          timeout 590s node tests/browser/live-memory.cjs http://127.0.0.1:8100/UnoPixelMap/ 2>&1 | tee "$PIXELMAP_LIVE_OUTPUT/diagnostic.log"
      - name: Preserve diagnostic evidence even when the unchanged app aborts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-corpus-memory-9171e95
          path: ${{ runner.temp }}/corpus-memory
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
