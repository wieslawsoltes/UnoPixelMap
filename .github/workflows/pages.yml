name: Pixel Atlas · browser and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixelmap-pages
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      PIXELMAP_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Pin the .NET 10 toolchain used for the Uno 7 WebGPU migration.
          dotnet-version: '10.0.403'
      - name: Install native graphics and the test font
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri fonts-dejavu-core
      - run: dotnet run --project tests/PixelMap.Data.Checks -c Release
      - run: dotnet run --project tests/PixelMap.Rendering.Tests -c Release
      - name: Verify WebGPU overlay geometry, labels and lifecycle
        run: dotnet run --project tests/PixelMap.Rendering.Tests -c Release -- --webgpu-overlay
      - name: Verify retained GLES reference renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: dotnet run --project tests/PixelMap.Rendering.Tests -c Release -- --gpu-terrain --gpu-output="${{ runner.temp }}/gpu-terrain"
      - run: dotnet run --project tests/PixelMap.Routing.Tests -c Release
      - run: dotnet run --project tests/PixelMap.Simulation.Tests -c Release
      - run: node tests/browser/audio.cjs
      - run: node tests/browser/input-adapter.cjs
      - run: node tests/browser/camera-replay-checks.cjs
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: dotnet publish src/PixelMap.App -c Release -f net10.0-browserwasm -o "${{ runner.temp }}/atlas"
      - name: Verify the Pages artifact
        run: node tests/packaging/package-identity.cjs "${{ runner.temp }}/atlas/wwwroot"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/atlas/wwwroot
          retention-days: 7
  verify:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Unpack the exact Pages deployment
        run: |
          mkdir -p "${{ runner.temp }}/atlas/wwwroot"
          tar -xf "${{ runner.temp }}/pages/artifact.tar" -C "${{ runner.temp }}/atlas/wwwroot"
      - name: Exercise the published map in Chromium
        run: |
          npm ci --prefix tests/browser
          (cd tests/browser && npx playwright install --with-deps chromium)
          node tests/browser/input-adapter-browser.cjs
          mkdir -p "${{ runner.temp }}/preview"
          ln -s "${{ runner.temp }}/atlas/wwwroot" "${{ runner.temp }}/preview/UnoPixelMap"
          python3 -m http.server 8100 --bind 127.0.0.1 --directory "${{ runner.temp }}/preview" > /tmp/atlas-server.log 2>&1 &
          # The previous compositor/readback matrix targets the retired GL presenter.
          # Exercise the shared-device WebGPU renderer, input, modes and failure states.
          PIXELMAP_SHOTS="${{ runner.temp }}/screens" node tests/browser/webgpu.cjs http://127.0.0.1:8100/UnoPixelMap/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: publish
        uses: actions/deploy-pages@v4
